version: "3.9"

services:
  db:
    image: mysql:8
    container_name: franquicias-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: franquicias_db
      MYSQL_USER: franquicias
      MYSQL_PASSWORD: franquicias
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - franquicias-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: franquicias-api
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/franquicias_db
      SPRING_DATASOURCE_USERNAME: franquicias
      SPRING_DATASOURCE_PASSWORD: franquicias
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    networks:
      - franquicias-net

networks:
  franquicias-net:

volumes:
  db_data:
